# Stage B: architecture from the seed artifact (A1/A2 checkpoint) -- there is NO model
# section here on purpose; window, delta rule, short conv, anchors all come out of the
# checkpoint's ModelSpec. LoRA is the only structural addition.
initialization:
  checkpoint: ckpts/train/stage_a2_c1_vdn_anchor/hybrid_step000500.pt
  base_source: null

# LoRA on the FROZEN base attention projections: q/k/v/o of every DiT block (the
# originals HybridAttention keeps at attn.orig) and q/k/v/o of the two token-refiner
# blocks. Nothing else in the base is touched; the feed-forward stays frozen.
lora:
  rank: 64
  alpha: 64
  targets:
    - attn.orig.to_q
    - attn.orig.to_k
    - attn.orig.to_v
    - attn.orig.to_out.0
    - token_refiner.refiner_blocks.*.attn.to_q
    - token_refiner.refiner_blocks.*.attn.to_k
    - token_refiner.refiner_blocks.*.attn.to_v
    - token_refiner.refiner_blocks.*.attn.to_out.0

training:
  max_steps: 2000
  objective: teacher

# One cosine schedule lr_at(step) = warmup(lr) -> cosine -> min_lr; every group follows
# it times its own scale. Trainables are the LoRA tensors plus every hybrid-transform
# parameter, split into three groups by module structure (utils/lr_classes.py):
#   lora          x1.0                  every lora_A / lora_B
#   branch_big    x branch_lr_scale     width-fan-in matrices: alpha.down, output_gate.down,
#                                       beta_proj, to_out_linear, softmax_gate
#   branch_small  x small_lr_scale      fixed-fan-in / vector params: alpha.A_log, alpha.dt_bias,
#                 (own AdamW eps)       alpha.up, output_gate.up, linear norm gain, short-conv taps
optimizer:
  name: adamw
  lr: 1.0e-4
  min_lr: 5.0e-6
  warmup_steps: 200
  weight_decay: 0.0
  grad_clip: 1.0
  branch_lr_scale: 0.4
  small_lr_scale: 2.0
  small_eps: 2.0e-9

checkpoint:
  output_dir: ckpts/train/stage_b_c1_vdn_anchor
  save_every: 10
  keep_states: 3
  early_saves: [0, 1, 2, 4]

data:
  # Your pre-encoded latents index (see "Data Preprocess" in the README for the layout).
  index_file: ???
